# See ci.yml.tabs for the properly indented version if you are having trouble seeing the indentation in this file.
# This version is only for Github to parse.
name: DFPSR tests
on: [push]
jobs:
  scriptedTest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd ./Source/test
          ./test.sh
      - name: Run tests on MacOS
        if: matrix.os == 'macos-latest'
        run: |
          cd ./Source/test
          ./test.sh
  builderTest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        architecture: [x86_64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests on Linux
        if: matrix.os == 'ubuntu-latest'
        run: ./Source/test/test_linux.sh
      - name: Run tests on MacOS
        if: matrix.os == 'macos-latest'
        run: ./Source/test/test_macos.sh
      - name: Run tests on Windows
        if: matrix.os == 'windows-latest'
        run: .\Source\test\test_windows.bat
  loongarchSimdTest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run SIMD tests on emulated LoongArch64
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: loongarch64
          distro: alpine_latest
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/opt/dfpsr"
          install: |
            apk add --no-cache g++ make bash
            g++ --version
          run: |
            cd /opt/dfpsr/Source/test
            bash run-simd-tests.sh